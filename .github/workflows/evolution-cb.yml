name: evolution-cb

# Constrói a nossa imagem da Evolution 2.4 (develop) a partir de um commit
# fixo do upstream, com os patches de docker/evolution-cb/ (a citação do
# cliente, a foto de perfil que travava a fila de entrada, a sessão única com
# a reconexão depois do logout e do 408, o recibo de grupo com o código do
# erro no webhook e o nome da instância no create), o ack do <status> na
# Baileys (pelo patch-package do próprio Dockerfile) e o prisma.config.ts
# dentro da imagem.
# Ver docker/evolution-cb/README.md, docs/PLANO-baileys-7.md (P10, 5.10) e
# docs/PLANO-recibos-de-grupo.md.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Commit do evolution-foundation/evolution-api (o da imagem em produção)'
        required: true
        default: 'e273b904d53f5726970fd6a244ed9caa61dfeb9a'
      tag:
        description: 'Tag de saída'
        required: true
        default: '2.4.0-e273b904-citacao-foto-sessao-status-recibo-criar'

env:
  IMAGE: ghcr.io/leonardocabralb/evolution-api-cb

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fonte do upstream no commit fixo
        uses: actions/checkout@v4
        with:
          repository: evolution-foundation/evolution-api
          ref: ${{ inputs.upstream_ref }}
          path: upstream

      - name: Aplicar os patches e copiar o prisma.config.ts na imagem
        run: |
          set -euo pipefail
          cd upstream
          # Nesta ordem: cada um foi gerado sobre os anteriores (regiões distintas
          # do mesmo arquivo; `git apply` tolera o deslocamento de linhas).
          git apply --check ../docker/evolution-cb/2708-citacao.patch
          git apply ../docker/evolution-cb/2708-citacao.patch
          git apply --check ../docker/evolution-cb/foto-de-perfil-por-telefone-com-teto.patch
          git apply ../docker/evolution-cb/foto-de-perfil-por-telefone-com-teto.patch
          git apply --check ../docker/evolution-cb/sessao-unica-e-reconexao.patch
          git apply ../docker/evolution-cb/sessao-unica-e-reconexao.patch
          git apply --check ../docker/evolution-cb/recibo-de-grupo.patch
          git apply ../docker/evolution-cb/recibo-de-grupo.patch
          git apply --check ../docker/evolution-cb/criar-instancia-com-nome.patch
          git apply ../docker/evolution-cb/criar-instancia-com-nome.patch
          test -f prisma.config.ts
          # builder: o arquivo entra junto com o resto do fonte
          sed -i 's#^COPY ./tsup.config.ts ./$#COPY ./tsup.config.ts ./\nCOPY ./prisma.config.ts ./#' Dockerfile
          # imagem final: ao lado do tsup.config.ts
          sed -i 's#^COPY --from=builder /evolution/tsup.config.ts ./tsup.config.ts$#COPY --from=builder /evolution/tsup.config.ts ./tsup.config.ts\nCOPY --from=builder /evolution/prisma.config.ts ./prisma.config.ts#' Dockerfile
          grep -c 'prisma.config.ts' Dockerfile | grep -qx 2
          grep -q 'quotedContext' src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          # A foto de perfil sai pelo telefone resolvido e com teto; a forma antiga (pelo LID, sem teto) não pode sobrar.
          # As negativas levam `|| exit 1`: sob `set -e`, um `! cmd` sozinho nunca para o passo.
          grep -q 'profilePicture(messageRaw.key.remoteJid, 5_000)' src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          ! grep -q 'profilePicture(received.key.remoteJid)' src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts || exit 1
          # Sessão única: um socket por instância (geração), o timer de 3 s confere a geração,
          # o connect zera o isDeleting, 408 com pareamento reconecta, o logout zera o QR e
          # não para mais no 'close' em memória. Sem pipe (grep -q sob pipefail dá trava falsa).
          BAILEYS=src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          grep -qF 'private socketGeneration = 0;' "$BAILEYS"
          grep -qF 'this.eventHandler(generation);' "$BAILEYS"
          grep -qF 'generation !== this.socketGeneration' "$BAILEYS"
          grep -qF "if (events['creds.update'] && isCurrentSocket) {" "$BAILEYS"
          grep -qF '(statusCode === DisconnectReason.timedOut && isPaired)' "$BAILEYS"
          ! grep -qF 'this.instance.authState = await this.defineAuthState();' "$BAILEYS" || exit 1
          # Dentro do método; texto fixo (index), sem regex, para valer igual em qualquer awk.
          awk 'index($0, "public async connectToWhatsapp(number") {f=1} f && index($0, "this.isDeleting = false;") {ok=1; exit} f && index($0, "this.loadChatwoot();") {exit} END {exit !ok}' "$BAILEYS"
          # A reconexão grava 'connecting' no banco antes do timer (senão a queda pareada fica 'open').
          awk 'index($0, "if (shouldReconnect) {") {f=1} f && index($0, "connectionStatus: '"'"'connecting'"'"'") {ok=1; exit} f && index($0, "Reconnecting in 3 seconds") {exit} END {exit !ok}' "$BAILEYS"
          awk 'index($0, "public async logoutInstance() {") {f=1} f && index($0, "this.instance.qrcode = { count: 0 };") {ok=1; exit} f && index($0, "public async getProfileName()") {exit} END {exit !ok}' "$BAILEYS"
          grep -qF 'if (!this.waMonitor.waInstances[instanceName]) {' src/api/controllers/instance.controller.ts
          ! grep -qF "instance.state === 'close'" src/api/controllers/instance.controller.ts || exit 1
          # A limpeza que apaga as creds (Session) apaga também as chaves Signal do Redis.
          awk 'index($0, "public async cleaningUp(instanceName") {f=1} f && index($0, "if (this.redis.REDIS.ENABLED) {") {ok=1; exit} f && index($0, "public async cleaningStoreData(") {exit} END {exit !ok}' src/api/services/monitor.service.ts
          # Recibo de grupo: o message-receipt.update de mensagem nossa em grupo vai ao webhook (sem o
          # próprio número, com o telefone do LID e sem `status`), e o messages.update leva o
          # messageStubParameters numa CÓPIA — o envio antigo, com o mesmo objeto do Prisma, não pode sobrar.
          grep -qF "!key.remoteJid.endsWith('@g.us')" "$BAILEYS"
          grep -qF '(me?.lid && areJidsSameUser(participant, me.lid))' "$BAILEYS"
          grep -qF 'getPNForLID(participant)' "$BAILEYS"
          grep -qF 'reciboDoGrupo,' "$BAILEYS"
          grep -qF '? { ...message, messageStubParameters }' "$BAILEYS"
          ! grep -qF 'this.sendDataWebhook(Events.MESSAGES_UPDATE, message);' "$BAILEYS" || exit 1
          # Criar instância: o nome sai do corpo validado SÓ na rota /create (o sanitize do
          # dataValidate o descarta); a forma antiga, sem o nome, não pode sobrar, e o
          # sanitize do abstract.router.ts fica intacto (afrouxá-lo reabriria o CVE #2435).
          ROTA=src/api/routes/instance.router.ts
          grep -qF 'instance.instanceName = data.instanceName;' "$ROTA"
          ! grep -qF 'execute: (instance) => instanceController.createInstance(instance),' "$ROTA" || exit 1
          grep -qF "const PROTECTED_INSTANCE_FIELDS = ['instanceName', 'instanceId'] as const;" src/api/abstract/abstract.router.ts
          # Ack do <status> (WhiskeySockets/Baileys#2858): o patch é da BAILEYS compilada, não do
          # fonte da Evolution. O Dockerfile do upstream copia patches/ antes do `npm ci` (cujo
          # postinstall roda o patch-package) e roda `npx patch-package` de novo; o nome do
          # arquivo tem de casar a versão instalada, e o build falha se o handler não estiver lá.
          grep -qF '"baileys": "7.0.0-rc13"' package.json
          test -d patches
          cp '../docker/evolution-cb/baileys+7.0.0-rc13.patch' patches/
          sed -i 's#^RUN npx patch-package$#RUN npx patch-package \&\& grep -qF "CB:status" node_modules/baileys/lib/Socket/messages-recv.js#' Dockerfile
          grep -qF 'RUN npx patch-package && grep -qF "CB:status" node_modules/baileys/lib/Socket/messages-recv.js' Dockerfile
          echo "patches e Dockerfile ok"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: upstream
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}

      - name: Como aplicar
        run: |
          {
            echo '## Imagem pronta'
            echo
            echo '```'
            echo '${{ env.IMAGE }}:${{ inputs.tag }}@${{ steps.build.outputs.digest }}'
            echo '```'
            echo
            echo 'Na VPS, SÓ com a fila de entrada vazia em TODAS as conexões (CLAUDE.md, seção 10; docs/INFRA-VPS.md, §9), com o serviço em stop-first. Sem mount: o prisma.config.ts já vem na imagem.'
            echo
            echo '```'
            echo 'docker service update --image ${{ env.IMAGE }}:${{ inputs.tag }}@${{ steps.build.outputs.digest }} evolution_evolution'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
