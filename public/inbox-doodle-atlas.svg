<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fundo do fio da conversa com o símbolo do Atlas CRM, a marca PADRÃO.

  Só aparece com a marca padrão (`useMarca().propria === false`): com marca
  própria o fio fica no `inbox-doodle.svg`, de ícones neutros — marca própria
  nunca herda imagem do Atlas (`.claude/rules/marca.md`).

  - Ladrilho de 240x240 repetido pelo CSS, no mesmo traço do
    `inbox-doodle.svg`: #64748b a 15%, espessura 1,5, pontas redondas.
    16 símbolos numa grade hexagonal com tremido; os dois que cruzam a emenda
    lateral têm a cópia do outro lado, e o ladrilho fecha sem corte.
  - O símbolo é o logo em traço, na grade de 24 do lucide: três barras de
    raio 2,5 sobre um triângulo equilátero de lado 16 (pontas em (12;4,944),
    (4;18,8) e (20;18,8)); a barra de baixo por cima das outras duas, a da
    direita por cima da esquerda no topo, como no logo. Um <path> só: o
    traço que se cruza não escurece.
  - Mesmo TOM do fundo antigo, medido: a média do alfa do ladrilho
    rasterizado (4x) fica a 0,3% da do `inbox-doodle.svg`. O símbolo tem
    mais traço que um ícone do lucide; por isso são 16 desenhos, e não 18,
    a 93% do tamanho. Mexeu no desenho, mede de novo.
  Escolha do operador (17/11/2026) entre duas opções de mesmo tom.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" stroke="#64748b" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
