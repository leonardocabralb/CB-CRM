# ============================================================
# Evolution API LOCAL — para desenvolver/testar o CRM sem tocar na
# produção. Espelha a config da VPS (v2), mas com Postgres local e cache
# local (sem Redis, para ficar leve).
#
# Subir:   docker compose -f docker-compose.evolution.yml up -d
# Logs:    docker compose -f docker-compose.evolution.yml logs -f evolution
# Parar:   docker compose -f docker-compose.evolution.yml down
# Manager: http://localhost:8080/manager  (login com a API key abaixo)
#
# Depois, no .env.local do CRM:
#   EVOLUTION_BASE_URL=http://localhost:8080
#   EVOLUTION_GLOBAL_API_KEY=localdev-evolution-key-troque-me
#   NEXT_PUBLIC_SITE_URL=http://host.docker.internal:3000   # ver "pegadinha" abaixo
# ============================================================

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - '8088:8080'
    environment:
      SERVER_URL: http://localhost:8088
      # Chave global do seu Evolution local (é você que define — troque à vontade).
      AUTHENTICATION_API_KEY: localdev-evolution-key-troque-me
      DEL_INSTANCE: 'false'
      # Banco (Postgres do serviço abaixo)
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_local
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      # Cache local (sem Redis) — suficiente para dev.
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      # Identidade da sessão (aparece no WhatsApp > Aparelhos conectados).
      CONFIG_SESSION_PHONE_CLIENT: CBCRM-Dev
      CONFIG_SESSION_PHONE_NAME: Chrome
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution_pgdata:
