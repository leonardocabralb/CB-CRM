<!doctype html>
<!--
  Página do atendente do Teste B (docs/PLANO-ligar-pelo-crm.md, Fase 2).
  Abre no navegador do atendente, pelo túnel SSH (http://localhost:8090/...:
  localhost conta como seguro, e o navegador libera o microfone).
-->
<html lang="pt-BR">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ponte de áudio — atendente</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 24px auto; max-width: 640px; padding: 0 16px; }
  button { font: inherit; font-size: 18px; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
  .medidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .medidas div { border: 1px solid #8884; border-radius: 8px; padding: 8px 10px; }
  .medidas b { display: block; font-size: 20px; }
  pre { background: #8881; padding: 8px; white-space: pre-wrap; font-size: 12px; max-height: 260px; overflow: auto; }
</style>
<h1>Ponte de áudio (teste)</h1>
<p>Use <b>fone de ouvido</b>. Clique em Conectar, permita o microfone e espere aparecer "conectado".</p>
<p>
  <button id="conectar">Conectar</button>
  <button id="desligar" disabled>Desligar</button>
</p>
<p>Estado: <b id="estado">parado</b></p>
<div class="medidas">
  <div>Ida e volta da rede<b id="rtt">—</b></div>
  <div>Variação na chegada<b id="jitter">—</b></div>
  <div>Pacotes perdidos<b id="perdidos">—</b></div>
</div>
<audio id="cliente" autoplay></audio>
<pre id="log"></pre>
<script>
  const STUN = [{ urls: "stun:stun.l.google.com:19302" }];
  const $ = (id) => document.getElementById(id);
  let pc = null;
  let fluxo = null;
  let relogio = null;
  let queda = null;
  const LINHAS_NA_TELA = 200;
  const ESPERA_DA_QUEDA_MS = 10000;
  const PRAZO_DO_PEDIDO_MS = 10000;

  function log(texto) {
    const linhas = (new Date().toLocaleTimeString() + " " + texto + "\n" + $("log").textContent).split("\n");
    $("log").textContent = linhas.slice(0, LINHAS_NA_TELA).join("\n");
    fetch("/log", { method: "POST", headers: { "X-Origem": "atendente" }, body: texto }).catch(() => {});
  }

  // Larga o microfone, a medição e a conexão, e devolve os botões. Chamada em
  // TODA saída (desligar, falha, a ponte que não responde, a rede que cai):
  // antes, a falha deixava o microfone aberto e o "Desligar" travado.
  function limpar(estado, motivo) {
    clearInterval(relogio);
    clearTimeout(queda);
    relogio = null;
    queda = null;
    if (pc) pc.close();
    pc = null;
    if (fluxo) fluxo.getTracks().forEach((t) => t.stop());
    fluxo = null;
    $("cliente").srcObject = null;
    $("estado").textContent = estado;
    $("desligar").disabled = true;
    $("conectar").disabled = false;
    if (motivo) log(motivo);
  }

  const ESTADOS = {
    new: "iniciando",
    checking: "conectando…",
    connected: "conectado",
    completed: "conectado",
    failed: "FALHOU: a rede não deixou o áudio passar",
    disconnected: "caiu",
    closed: "desligado",
  };

  function esperarCandidatos(conexao) {
    return new Promise((pronto) => {
      if (conexao.iceGatheringState === "complete") return pronto();
      const aoMudar = () => {
        if (conexao.iceGatheringState === "complete") {
          conexao.removeEventListener("icegatheringstatechange", aoMudar);
          pronto();
        }
      };
      conexao.addEventListener("icegatheringstatechange", aoMudar);
      setTimeout(pronto, 4000);
    });
  }

  async function medir() {
    if (!pc) return;
    const stats = await pc.getStats();
    const candidatos = {};
    stats.forEach((s) => {
      if (s.type === "local-candidate" || s.type === "remote-candidate") candidatos[s.id] = s;
    });
    let rtt, jitter, perdidos, recebidos, caminho, buffer;
    stats.forEach((s) => {
      if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") {
        rtt = s.currentRoundTripTime;
        caminho =
          (candidatos[s.localCandidateId] || {}).candidateType + "↔" + (candidatos[s.remoteCandidateId] || {}).candidateType;
      }
      if (s.type === "inbound-rtp" && s.kind === "audio") {
        jitter = s.jitter;
        perdidos = s.packetsLost;
        recebidos = s.packetsReceived;
        if (s.jitterBufferEmittedCount) buffer = (s.jitterBufferDelay / s.jitterBufferEmittedCount) * 1000;
      }
    });
    const ms = (v) => (v == null ? "?" : Math.round(v * 1000));
    $("rtt").textContent = rtt == null ? "—" : ms(rtt) + " ms";
    $("jitter").textContent = jitter == null ? "—" : ms(jitter) + " ms";
    $("perdidos").textContent = perdidos == null ? "—" : perdidos + " de " + (perdidos + recebidos);
    log(
      `medida: ida e volta ${ms(rtt)} ms, jitter ${ms(jitter)} ms, perdidos ${perdidos}/${(perdidos || 0) + (recebidos || 0)}, ` +
        `espera no buffer ${buffer == null ? "?" : Math.round(buffer)} ms, caminho ${caminho}`
    );
  }

  $("conectar").onclick = async () => {
    $("conectar").disabled = true;
    try {
      fluxo = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      const conexao = new RTCPeerConnection({ iceServers: STUN });
      pc = conexao;
      fluxo.getTracks().forEach((t) => conexao.addTrack(t, fluxo));
      conexao.ontrack = (evento) => {
        $("cliente").srcObject = evento.streams[0];
        $("cliente").play().catch(() => {});
      };
      conexao.oniceconnectionstatechange = () => {
        if (pc !== conexao) return; // conexão antiga avisando depois de limpa
        const estado = conexao.iceConnectionState;
        $("estado").textContent = ESTADOS[estado] || estado;
        log("rede: " + estado);
        clearTimeout(queda);
        if (estado === "failed") limpar(ESTADOS.failed, "a rede não deixou o áudio passar");
        else if (estado === "disconnected")
          queda = setTimeout(() => limpar("caiu", "a conexão caiu e não voltou em 10 s"), ESPERA_DA_QUEDA_MS);
      };
      await conexao.setLocalDescription(await conexao.createOffer());
      await esperarCandidatos(conexao);
      const envio = await fetch("/oferta", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sdp: conexao.localDescription.sdp }),
        signal: AbortSignal.timeout(PRAZO_DO_PEDIDO_MS),
      });
      if (!envio.ok) throw new Error("a sinalização recusou a oferta (" + envio.status + ")");
      const { id } = await envio.json();
      $("estado").textContent = "esperando a ponte…";
      let resposta = null;
      for (let i = 0; i < 30 && !resposta && pc === conexao; i++) {
        const r = await fetch("/resposta?id=" + id, { signal: AbortSignal.timeout(PRAZO_DO_PEDIDO_MS) });
        if (r.status === 200) resposta = await r.json();
        else await new Promise((s) => setTimeout(s, 1000));
      }
      if (pc !== conexao) return; // desligado no meio da espera
      if (!resposta) {
        limpar("a ponte não respondeu", "a ponte não respondeu em 30 s");
        return;
      }
      await conexao.setRemoteDescription({ type: "answer", sdp: resposta.sdp });
      $("desligar").disabled = false;
      relogio = setInterval(medir, 2000);
    } catch (erro) {
      limpar("erro: " + erro.message, "erro: " + erro.message);
    }
  };

  $("desligar").onclick = () => limpar("desligado", "desligado pelo atendente");
</script>
</html>
