# ============================================================
# Docker Swarm stack for the CRM, fronted by the existing Traefik.
#
# First deploy (on the VPS):
#   set -a && source crm.env && set +a
#   docker stack deploy -c docker-stack.yml crm
#
# Values below match THIS VPS's Traefik (confirmed via SSH), mirroring the
# working Evolution service: overlay network `CBAdvNet`, entrypoint
# `websecure` (:443, with :80->:443 redirect), cert resolver
# `letsencryptresolver`. Traefik issues the TLS cert automatically once
# crm.cbadvogados.com's DNS points at the VPS.
# ============================================================

services:
  crm:
    # Built + pushed by CI (see .github/workflows/deploy.yml). Override the
    # tag at deploy time with CRM_IMAGE=ghcr.io/leonardocabralb/cb-crm:<sha>.
    image: ${CRM_IMAGE:-ghcr.io/leonardocabralb/cb-crm:latest}
    environment:
      # NEXT_PUBLIC_* are also read server-side at runtime; keep them here.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: https://crm.cbadvogados.com
      NEXT_PUBLIC_APP_LOCALE: en
      # Server-only secrets.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET}
      # Meta secret arrives at the production cutover — optional for now.
      META_APP_SECRET: ${META_APP_SECRET:-}
      # Evolution transport (WhatsApp gateway) — server + keys + webhook secret.
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
    networks:
      - CBAdvNet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first # zero-downtime: new task healthy before old stops
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=CBAdvNet
        - traefik.http.routers.crm.rule=Host(`crm.cbadvogados.com`)
        - traefik.http.routers.crm.entrypoints=websecure
        - traefik.http.routers.crm.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crm.service=crm
        - traefik.http.services.crm.loadbalancer.server.port=3000
        - traefik.http.services.crm.loadbalancer.passHostHeader=true

networks:
  CBAdvNet:
    external: true # the overlay Traefik + Evolution already share
